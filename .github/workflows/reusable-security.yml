name: Reusable · Seguridad

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (dependencias)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # OWASP A03 (supply chain): una vulnerabilidad alta o crítica en producción corta el pipeline.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Gitleaks (secretos)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
