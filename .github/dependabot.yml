# Supply chain (OWASP A03): Dependabot abre PRs semanales con las actualizaciones.
# Los prefijos respetan Conventional Commits para que pasen commitlint y semantic-release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    groups:
      dev-dependencies:
        dependency-type: development
    # NestJS se mantiene en la línea 11: un salto mayor (12) rompe los peers (@nestjs/testing 12
    # exige @nestjs/common 12) y es una migración, no un parche. Se siguen recibiendo minor y patch.
    ignore:
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 queda fuera del rango que soporta ts-jest 29 (peer typescript >=4.3 <7).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(deps)
