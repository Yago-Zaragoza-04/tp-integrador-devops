# Entorno completo y reproducible con un solo comando:
#   docker compose up --build -d
# API: http://localhost:3000/docs · Prometheus: http://localhost:9090 · Grafana: http://localhost:3001
name: tp-integrador-devops

services:
  api:
    build:
      context: .
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-local}
        GIT_SHA: ${GIT_SHA:-local}
    image: tp-integrador-devops:local
    init: true                       # PID 1 que reenvía señales: el graceful shutdown funciona
    ports:
      - "3000:3000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CHAOS_ENABLED: ${CHAOS_ENABLED:-true}   # solo local: habilita los experimentos de falla
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100000}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/golden-signals.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Generador de tráfico para las golden signals: docker compose --profile load up loadgen
  loadgen:
    image: node:22.23.3-alpine3.24
    profiles: [load]
    working_dir: /scripts
    command: ["node", "load-test.mjs"]
    environment:
      TARGET_URL: http://api:3000
      DURATION_S: ${DURATION_S:-300}
      RPS: ${RPS:-10}
      CHAOS_RATIO: ${CHAOS_RATIO:-0.05}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      api:
        condition: service_healthy

  # Lint + tests dentro de la etapa "test" del Dockerfile: docker compose --profile test run --rm test
  test:
    build:
      context: .
      target: test
    profiles: [test]

volumes:
  prometheus-data:
  grafana-data:
